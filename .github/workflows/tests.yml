name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: python demo.py
      - name: Demo must have no guardrail breaches
        run: python -c "import json,sys; d=json.load(open('demo_output/summary.json')); sys.exit(1 if d['breaches'] else 0)"
